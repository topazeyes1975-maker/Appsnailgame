<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Armored Snail: Level 1 Survival</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050508; font-family: sans-serif; touch-action: none; }
        #ui { position: absolute; top: 10px; left: 10px; color: #00ffcc; font-size: 15px; font-weight: bold; pointer-events: none; z-index: 10; line-height: 1.5; text-shadow: 0 0 5px rgba(0,255,204,0.4); }
        
        .health-bar-container { width: 160px; height: 14px; background: rgba(255,255,255,0.1); border: 2px solid #00ffcc; border-radius: 4px; overflow: hidden; display: inline-block; vertical-align: middle; margin-left: 5px; }
        #health-fill { width: 100%; height: 100%; background: #00ffcc; transition: width 0.2s ease; box-shadow: 0 0 8px #00ffcc; }

        .joystick { position: absolute; bottom: 30px; width: 120px; height: 120px; background: rgba(0,255,204,0.05); border: 2px solid rgba(0,255,204,0.3); border-radius: 50%; pointer-events: auto; }
        #left-stick { left: 30px; }
        #right-stick { right: 30px; }
        .stick-knob { position: absolute; top: 35px; left: 35px; width: 50px; height: 50px; background: rgba(0,255,204,0.3); border-radius: 50%; pointer-events: none; box-shadow: 0 0 10px rgba(0,255,204,0.5); }
        
        #status-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5,5,8,0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; color: #00ffcc; font-size: 28px; font-weight: bold; z-index: 100; text-align: center; display: none; text-shadow: 0 0 10px #00ffcc; }
        #status-screen button { margin-top: 20px; padding: 12px 24px; background: #00ffcc; border: none; color: #050508; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="ui">
        Objective: Rescue Babies & Survive!<br>
        Babies: <span id="score">0</span>/2 | Status: <span id="player-status">Active</span><br>
        Health: <div class="health-bar-container"><div id="health-fill"></div></div><br>
        Time Left: <span id="timer">45</span>s
    </div>
    
    <div id="left-stick" class="joystick"><div id="left-knob" class="stick-knob"></div></div>
    <div id="right-stick" class="joystick"><div id="right-knob" class="stick-knob"></div></div>

    <div id="status-screen">
        <div id="status-text">MISSION COMPLETE</div>
        <button onclick="location.reload()">Play Again</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050508);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 12, 12);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x333355, 1.2);
        scene.add(ambientLight);
        
        const dirLight = new THREE.DirectionalLight(0x00ffcc, 1.2);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // Floor & Grid
        const floorGeo = new THREE.PlaneGeometry(100, 100);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x0c0c16, roughness: 0.8, metalness: 0.2 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -0.05;
        scene.add(floor);

        const floorGrid = new THREE.GridHelper(60, 30, 0x00ffcc, 0x1a1a3a);
        floorGrid.position.y = 0.01;
        scene.add(floorGrid);

        // Home Base
        const baseGeo = new THREE.BoxGeometry(4, 0.1, 4);
        const baseMat = new THREE.MeshStandardMaterial({ color: 0x00ffcc, emissive: 0x00ffcc, emissiveIntensity: 0.3 });
        const homeBase = new THREE.Mesh(baseGeo, baseMat);
        homeBase.position.set(0, 0.02, 4);
        scene.add(homeBase);

        // Maze Obstacles
        const obstacleMat = new THREE.MeshStandardMaterial({ color: 0x333366, roughness: 0.5, metalness: 0.5 });
        function createWall(x, z, width, depth) {
            const wall = new THREE.Mesh(new THREE.BoxGeometry(width, 2, depth), obstacleMat);
            wall.position.set(x, 1, z);
            scene.add(wall);
        }
        createWall(-6, -6, 2, 6);
        createWall(6, -8, 6, 2);

        // Baby Rooms / Containment Cages
        const roomGeo = new THREE.BoxGeometry(2.5, 2.5, 2.5);
        const roomMat = new THREE.MeshStandardMaterial({ color: 0xff0055, emissive: 0xff0055, emissiveIntensity: 0.5, wireframe: true });
        
        const room1 = new THREE.Mesh(roomGeo, roomMat);
        room1.position.set(-8, 1.25, -12);
        scene.add(room1);

        const room2 = new THREE.Mesh(roomGeo, roomMat);
        room2.position.set(8, 1.25, -15);
        scene.add(room2);

        const loader = new THREE.GLTFLoader();
        const rooms = [];

        // Fallback helper placeholders while models load
        const fallbackBabyGeo = new THREE.SphereGeometry(0.6, 16, 16);
        const fallbackBabyMat = new THREE.MeshStandardMaterial({ color: 0xff0055, emissive: 0xff0055, emissiveIntensity: 0.8 });

        function createFallbackBaby(x, z) {
            const mesh = new THREE.Mesh(fallbackBabyGeo, fallbackBabyMat);
            mesh.position.set(x, 0.6, z);
            scene.add(mesh);
            return mesh;
        }

        let babyModelTemplate = null;
        let pendingRooms = [];

        // Load 3D Baby Snails
        loader.load('file:///storage/emulated/0/Download/3D/Meshy_AI_Galactic_Snail_1785475444_image-to-3d-texture.glb', function (gltf) {
            babyModelTemplate = gltf.scene;
            initRoomsWithModels();
        }, undefined, function (error) {
            console.warn('CORS/Local load blocked for baby model, using fallback shapes.', error);
            rooms.push({ mesh: room1, babyMesh: createFallbackBaby(-8, -12), rescued: false });
            rooms.push({ mesh: room2, babyMesh: createFallbackBaby(8, -15), rescued: false });
        });

        function initRoomsWithModels() {
            if (!babyModelTemplate) return;
            
            const babyModel1 = babyModelTemplate.clone();
            babyModel1.scale.set(0.15, 0.15, 0.15);
            babyModel1.position.set(-8, 0.3, -12);
            scene.add(babyModel1);

            const babyModel2 = babyModelTemplate.clone();
            babyModel2.scale.set(0.15, 0.15, 0.15);
            babyModel2.position.set(8, 0.3, -15);
            scene.add(babyModel2);

            rooms.push({ mesh: room1, babyMesh: babyModel1, rescued: false });
            rooms.push({ mesh: room2, babyMesh: babyModel2, rescued: false });
        }

        // Magic Bell Hazard
        const bellGeo = new THREE.ConeGeometry(0.8, 1.5, 16);
        const bellMat = new THREE.MeshStandardMaterial({ color: 0xffcc00, emissive: 0xffcc00, emissiveIntensity: 0.6, metalness: 0.8 });
        const magicBell = new THREE.Mesh(bellGeo, bellMat);
        magicBell.position.set(3, 0.75, -4);
        scene.add(magicBell);
        let bellVelocity = new THREE.Vector3(0.04, 0, 0.03);

        // Enemy Shooters & Projectiles
        const enemyMat = new THREE.MeshStandardMaterial({ color: 0xff3300, emissive: 0xff3300, emissiveIntensity: 0.4 });
        const enemies = [];
        const bullets = [];
        const bulletGeo = new THREE.SphereGeometry(0.2, 8, 8);
        const bulletMat = new THREE.MeshStandardMaterial({ color: 0xff3300, emissive: 0xff3300, emissiveIntensity: 1.0 });

        for(let i = 0; i < 2; i++) {
            const enemy = new THREE.Mesh(new THREE.BoxGeometry(1, 1.8, 1), enemyMat);
            enemy.position.set((Math.random() - 0.5) * 20, 0.9, -5 - Math.random() * 15);
            scene.add(enemy);
            enemies.push({ 
                mesh: enemy, 
                speedX: (Math.random() - 0.5) * 0.04, 
                speedZ: (Math.random() - 0.5) * 0.04,
                shootCooldown: Math.random() * 60 + 30 
            });
        }

        // Snail Group (Main Character)
        const snailGroup = new THREE.Group();
        scene.add(snailGroup);

        const ringGeo = new THREE.TorusGeometry(1.8, 0.08, 16, 100);
        const ringMat = new THREE.MeshStandardMaterial({ color: 0x00ffcc, emissive: 0x00ffcc, wireframe: true });
        const energyShell = new THREE.Mesh(ringGeo, ringMat);
        energyShell.rotation.x = Math.PI / 2;
        energyShell.position.y = 0.5;
        snailGroup.add(energyShell);

        // Fallback main character shape if local load fails
        const fallbackMainGeo = new THREE.BoxGeometry(1, 1, 1);
        const fallbackMainMat = new THREE.MeshStandardMaterial({ color: 0x00ffcc, emissive: 0x00ffcc });
        const fallbackMain = new THREE.Mesh(fallbackMainGeo, fallbackMainMat);
        fallbackMain.position.y = 0.5;
        snailGroup.add(fallbackMain);

        // Load Main Astral Knight Snail Model
        loader.load('file:///storage/emulated/0/Download/Meshy_AI_Astral_Knight_of_the_Cosmic_Shell_1781887443_image-to-3d-texture-compressed.glb', function (gltf) {
            snailGroup.remove(fallbackMain); // Remove fallback box once model loads successfully
            const character = gltf.scene;
            character.scale.set(0.2, 0.2, 0.2);
            character.position.y = 1; 
            snailGroup.add(character);
        }, undefined, function (error) {
            console.warn('CORS/Local load blocked for main character model, keeping fallback shape.', error);
        });

        // Game State
        let moveX = 0, moveZ = 0;
        let score = 0;
        let health = 100;
        let carriedBabies = [];
        let timeLeft = 45;
        let freezeTimer = 0;
        let gameOver = false;

        setInterval(() => {
            if (!gameOver && timeLeft > 0) {
                timeLeft--;
                document.getElementById('timer').innerText = timeLeft;
                if (timeLeft === 0 && score < 2) {
                    endGame("TIME UP - MISSION FAILED");
                }
            }
        }, 1000);

        function setupJoystick(stickId, knobId, callback) {
            const stick = document.getElementById(stickId);
            const knob = document.getElementById(knobId);
            const maxDist = 35;
            let activeTouchId = null;

            stick.addEventListener('touchstart', (e) => {
                const touch = e.changedTouches[0];
                activeTouchId = touch.identifier;
                updateStick(touch);
            });
            window.addEventListener('touchmove', (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === activeTouchId) updateStick(e.changedTouches[i]);
                }
            });
            window.addEventListener('touchend', (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === activeTouchId) {
                        activeTouchId = null;
                        knob.style.transform = `translate(0px, 0px)`;
                        callback(0, 0);
                    }
                }
            });
            function updateStick(touch) {
                const r = stick.getBoundingClientRect();
                let x = touch.clientX - r.left - (r.width / 2);
                let y = touch.clientY - r.top - (r.height / 2);
                const dist = Math.sqrt(x * x + y * y);
                if (dist > maxDist) { x = (x / dist) * maxDist; y = (y / dist) * maxDist; }
                knob.style.transform = `translate(${x}px, ${y}px)`;
                callback(x / maxDist, y / maxDist);
            }
        }

        setupJoystick('left-stick', 'left-knob', (x, y) => { moveX = x; moveZ = y; });
        setupJoystick('right-stick', 'right-knob', (x, y) => {
            if (Math.abs(x) > 0.4 || Math.abs(y) > 0.4) energyShell.scale.set(1.3, 1.3, 1.3);
            else energyShell.scale.set(1, 1, 1);
        });

        function updateHealthBar() {
            const fill = document.getElementById('health-fill');
            fill.style.width = Math.max(0, health) + '%';
            if (health < 30) {
                fill.style.background = '#ff3300';
            } else {
                fill.style.background = '#00ffcc';
            }
        }

        function endGame(message) {
            gameOver = true;
            document.getElementById('status-text').innerText = message;
            document.getElementById('status-screen').style.display = 'flex';
        }

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            if (gameOver) return;

            // Handle Freeze State
            if (freezeTimer > 0) {
                freezeTimer -= 0.016;
                document.getElementById('player-status').innerText = "FROZEN (" + Math.ceil(freezeTimer) + "s)";
                document.getElementById('player-status').style.color = "#ffcc00";
            } else {
                document.getElementById('player-status').innerText = "Active";
                document.getElementById('player-status').style.color = "#00ffcc";

                let newX = snailGroup.position.x + (moveX * 0.08);
                let newZ = snailGroup.position.z + (moveZ * 0.08);
                snailGroup.position.x = Math.max(-25, Math.min(25, newX));
                snailGroup.position.z = Math.max(-25, Math.min(25, newZ));

                if (moveX !== 0 || moveZ !== 0) {
                    snailGroup.rotation.y = Math.atan2(moveX, moveZ);
                }
            }

            energyShell.rotation.z += 0.05;

            // Move Magic Bell Hazard
            magicBell.position.add(bellVelocity);
            if (Math.abs(magicBell.position.x) > 15) bellVelocity.x *= -1;
            if (Math.abs(magicBell.position.z + 10) > 15) bellVelocity.z *= -1;
            magicBell.rotation.y += 0.03;

            // Check Bell Freeze Collision
            if (freezeTimer <= 0 && snailGroup.position.distanceTo(magicBell.position) < 1.8) {
                freezeTimer = 5.0; 
            }

            // Move Random Enemy Shooters & Fire Bullets
            enemies.forEach(en => {
                en.mesh.position.x += en.speedX;
                en.mesh.position.z += en.speedZ;
                if (Math.abs(en.mesh.position.x) > 20) en.speedX *= -1;
                if (Math.abs(en.mesh.position.z) > 20) en.speedZ *= -1;

                en.shootCooldown--;
                if (en.shootCooldown <= 0) {
                    en.shootCooldown = 90 + Math.random() * 60;
                    const bullet = new THREE.Mesh(bulletGeo, bulletMat);
                    bullet.position.copy(en.mesh.position);
                    bullet.position.y = 1.0;
                    const dir = new THREE.Vector3().subVectors(snailGroup.position, en.mesh.position).normalize();
                    scene.add(bullet);
                    bullets.push({ mesh: bullet, dir: dir, speed: 0.12 });
                }

                if (snailGroup.position.distanceTo(en.mesh.position) < 2.0) {
                    health = Math.max(0, health - 1.0);
                    updateHealthBar();
                    if (health <= 0) endGame("GAME OVER - DESTROYED");
                }
            });

            // Update Bullets
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.mesh.position.addScaledVector(b.dir, b.speed);

                if (b.mesh.position.distanceTo(snailGroup.position) < 1.5) {
                    health = Math.max(0, health - 15);
                    updateHealthBar();
                    scene.remove(b.mesh);
                    bullets.splice(i, 1);
                    if (health <= 0) endGame("GAME OVER - SHOT DOWN");
                    continue;
                }

                if (Math.abs(b.mesh.position.x) > 30 || Math.abs(b.mesh.position.z) > 30) {
                    scene.remove(b.mesh);
                    bullets.splice(i, 1);
                }
            }

            // Room Rescue & Following Mechanics
            rooms.forEach(room => {
                if (!room.rescued && room.babyMesh && snailGroup.position.distanceTo(room.mesh.position) < 3.0) {
                    room.rescued = true;
                    room.mesh.visible = false; // Hide room cage
                    carriedBabies.push(room.babyMesh);
                }
            });

            // Make rescued babies follow right behind the snail
            for (let i = 0; i < carriedBabies.length; i++) {
                let baby = carriedBabies[i];
                let targetPos = snailGroup.position.clone().add(new THREE.Vector3(0, 0, 1.5 + (i * 1.0)).applyAxisAngle(new THREE.Vector3(0,1,0), snailGroup.rotation.y));
                baby.position.lerp(targetPos, 0.1);
                baby.position.y = 0.3;
            }

            // Home Base Drop-off Check
            if (carriedBabies.length > 0 && snailGroup.position.distanceTo(homeBase.position) < 3.5) {
                score += carriedBabies.length;
                document.getElementById('score').innerText = score;
                
                carriedBabies.forEach(baby => scene.remove(baby));
                carriedBabies = [];

                if (score >= 2) {
                    endGame("LEVEL 1 VICTORY!");
                }
            }

            // Camera Tracking
            camera.position.x = snailGroup.position.x;
            camera.position.z = snailGroup.position.z + 12;
            camera.lookAt(snailGroup.position.x, snailGroup.position.y, snailGroup.position.z);

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
