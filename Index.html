<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Game Homepage</title>
  <style>
    /* Basic layout styling */
    body {
      text-align: center;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .hidden {
      display: none;
    }
    .btn {
      padding: 12px 24px;
      margin: 10px;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- 1. INTRO SECTION -->
  <div id="intro-section">
    <h1>Welcome to the Adventure!</h1>
    <p>Watch the story or skip right into the action...</p>
    
    <!-- Skip Intro Button -->
    <button class="btn" onclick="skipIntro()">Skip Intro</button>
  </div>

  <!-- 2. MAIN HOMEPAGE MENU (Hidden until intro is done/skipped) -->
  <div id="main-menu" class="hidden">
    <h1>Main Base</h1>

    <!-- Start/Continue Level Button -->
    <div>
      <button id="start-level-btn" class="btn">Start Game</button>
    </div>

    <!-- Home Base / Nursery Button -->
    <div>
      <button id="home-base-btn" class="btn" onclick="goToHomeBase()">Go to Home Base / Nursery</button>
    </div>
  </div>

  <script>
    // --- INTRO LOGIC ---
    function skipIntro() {
      // Hide the intro text and reveal the main menu
      document.getElementById('intro-section').classList.add('hidden');
      document.getElementById('main-menu').classList.remove('hidden');
    }

    // --- LEVEL PROGRESSION LINK ---
    // Reads current level from device memory (defaults to 1)
    let currentLevel = localStorage.getItem('savedGameLevel') || 1;
    const startBtn = document.getElementById('start-level-btn');

    if (currentLevel > 1) {
      startBtn.innerText = "Continue Level " + currentLevel;
    } else {
      startBtn.innerText = "Start Level 1";
    }

    startBtn.addEventListener('click', () => {
      // Directs to level1.html, level2.html, etc.
      window.location.href = `./level${currentLevel}.html`;
    });

    // --- HOME BASE / NURSERY LINK ---
    function goToHomeBase() {
      // Directs to your separate home base file
      window.location.href = './homebase.html';
    }
  </script>

</body>
</html>
