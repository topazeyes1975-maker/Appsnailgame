<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Armored Snail: Level 1 Survival</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050508; font-family: sans-serif; touch-action: none; }
        #ui { position: absolute; top: 10px; left: 10px; color: #00ffcc; font-size: 15px; font-weight: bold; pointer-events: none; z-index: 10; line-height: 1.5; text-shadow: 0 0 5px rgba(0,255,204,0.4); }
        
        .health-bar-container { width: 160px; height: 14px; background: rgba(255,255,255,0.1); border: 2px solid #00ffcc; border-radius: 4px; overflow: hidden; display: inline-block; vertical-align: middle; margin-left: 5px; }
        #health-fill { width: 100%; height: 100%; background: #00ffcc; transition: width 0.2s ease; box-shadow: 0 0 8px #00ffcc; }

        .joystick { 
            position: absolute; 
            bottom: 30px; 
            left: 30px;
            width: 120px; 
            height: 120px; 
            background: rgba(5, 5, 8, 0.75); 
            border: 3px solid #00ffcc; 
            border-radius: 50%; 
            pointer-events: auto; 
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.5), inset 0 0 10px rgba(0, 0, 0, 0.8);
        }

        .stick-knob { 
            position: absolute; 
            top: 35px; 
            left: 35px; 
            width: 50px; 
            height: 50px; 
            background: #00ffcc; 
            border: 2px solid #050508;
            border-radius: 50%; 
            pointer-events: none; 
            box-shadow: 0 0 12px #00ffcc; 
        }

        #status-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5,5,8,0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; color: #00ffcc; font-size: 28px; font-weight: bold; z-index: 100; text-align: center; display: none; text-shadow: 0 0 10px #00ffcc; }
        #status-screen button { margin-top: 20px; padding: 12px 24px; background: #00ffcc; border: none; color: #050508; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="ui">
        Objective: Rescue Babies & Survive!<br>
        Babies: <span id="score">0</span>/2 | Status: <span id="player-status">Active</span><br>
        Health: <div class="health-bar-container"><div id="health-fill"></div></div><br>
        Time Left: <span id="timer">45</span>
    </div>
    
    <div id="left-stick" class="joystick"><div id="left-knob" class="stick-knob"></div></div>

    <div id="status-screen">
        <div id="status-text">LEVEL 1 COMPLETE</div>
        <button onclick="location.reload()">Play Again</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050508);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 12, 10);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const loader = new THREE.GLTFLoader();
        const textureLoader = new THREE.TextureLoader();

        // Helper function to dynamically snap models so their feet/bottom sit at y = 0
        function alignModelToGround(model) {
            const box = new THREE.Box3().setFromObject(model);
            model.position.y -= box.min.y;
        }

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
        scene.add(ambientLight);
        
        const dirLight = new THREE.DirectionalLight(0x00ffcc, 1.8);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // Ground Image Texture Loading
        // Replace 'floor_texture.jpg' with your actual ground image filename
        const floorTexture = textureLoader.load('1785671824766.png', function (tex) {
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(12, 12);
        });

        const floorGeo = new THREE.PlaneGeometry(100, 100);
        const floorMat = new THREE.MeshStandardMaterial({ 
            map: floorTexture,
            roughness: 0.8, 
            metalness: 0.2 
        });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = 0;
        scene.add(floor);

        // Wall Image Texture Loading
        // Replace 'wall_texture.jpg' with your actual wall image filename
        const wallTexture = textureLoader.load('1787589407750~2.jpg', function (tex) {
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(2, 1);
        });

        const obstacleMat = new THREE.MeshStandardMaterial({ map: wallTexture, roughness: 0.4, metalness: 0.5 });
        const wallBoundingBoxes = [];

        function createWall(x, z, width, depth) {
            const wallGeo = new THREE.BoxGeometry(width, 2.5, depth);
            const wall = new THREE.Mesh(wallGeo, obstacleMat);
            wall.position.set(x, 1.25, z);
            scene.add(wall);

            const edges = new THREE.EdgesGeometry(wallGeo);
            const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x00ffcc }));
            line.position.copy(wall.position);
            scene.add(line);

            const box = new THREE.Box3().setFromObject(wall);
            wallBoundingBoxes.push(box);
        }

        createWall(0, -22, 44, 2);
        createWall(-22, 0, 2, 44);
        createWall(22, 0, 2, 44);
        createWall(0, 22, 44, 2);
        createWall(-8, -10, 2, 16);
        createWall(8, -10, 2, 16);
        createWall(0, -2, 14, 2);
        createWall(-12, 6, 12, 2);
        createWall(12, 6, 12, 2);

        // Home Base Model
        const homeBaseGroup = new THREE.Group();
        homeBaseGroup.position.set(1, 0, 1);
        scene.add(homeBaseGroup);

        const baseGeo = new THREE.BoxGeometry(4, 0.1, 4);
        const baseMat = new THREE.MeshStandardMaterial({ color: 0x00ffcc, emissive: 0x00ffcc, emissiveIntensity: 0.3 });
        const fallbackBase = new THREE.Mesh(baseGeo, baseMat);
        homeBaseGroup.add(fallbackBase);

        loader.load('Meshy_AI_Doorway to Time_1785740856_image-to-3d-texture-compressed.glb', function (gltf) {
            homeBaseGroup.remove(fallbackBase);
            const baseModel = gltf.scene;
            baseModel.scale.set(1.5, 1.5, 1.5);
            alignModelToGround(baseModel);
            homeBaseGroup.add(baseModel);
        });

        // Baby Containment Cages
        const roomGeo = new THREE.BoxGeometry(2.5, 2.5, 2.5);
        const roomMat = new THREE.MeshStandardMaterial({ color: 0xff0055, emissive: 0xff0055, emissiveIntensity: 0.5, wireframe: true });
        
        const room1 = new THREE.Mesh(roomGeo, roomMat);
        room1.position.set(-14, 1.25, -14);
        scene.add(room1);

        const room2 = new THREE.Mesh(roomGeo, roomMat);
        room2.position.set(14, 1.25, -14);
        scene.add(room2);

        const rooms = [];

        loader.load('Meshy_AI_Galactic Snail_1785475444_image-to-3d-texture-compressed.glb', function (gltf) {
            const babyModel1 = gltf.scene.clone();
            babyModel1.scale.set(0.35, 0.35, 0.35);
            alignModelToGround(babyModel1);
            babyModel1.position.x = -14;
            babyModel1.position.z = -14;
            scene.add(babyModel1);

            const babyModel2 = gltf.scene.clone();
            babyModel2.scale.set(0.35, 0.35, 0.35);
            alignModelToGround(babyModel2);
            babyModel2.position.x = 14;
            babyModel2.position.z = -14;
            scene.add(babyModel2);

            rooms.push({ mesh: room1, babyMesh: babyModel1, rescued: false });
            rooms.push({ mesh: room2, babyMesh: babyModel2, rescued: false });
        });

        // Magic Bell Hazard
        const bellGroup = new THREE.Group();
        bellGroup.position.set(0, 0, -8);
        scene.add(bellGroup);

        loader.load('Meshy_AI_Neon Liberty Bell_1785740945_image-to-3d-texture-compressed.glb', function (gltf) {
            const bellModel = gltf.scene;
            bellModel.scale.set(0.45, 0.45, 0.45);
            alignModelToGround(bellModel);
            bellGroup.add(bellModel);
        });

        let bellVelocity = new THREE.Vector3(0.04, 0, 0.03);

        // Enemy Shooters
        const enemies = [];
        const bullets = [];
        const bulletGeo = new THREE.SphereGeometry(0.25, 8, 8);
        const bulletMat = new THREE.MeshStandardMaterial({ color: 0xff3300, emissive: 0xff3300, emissiveIntensity: 1.0 });

        for (let i = 0; i < 2; i++) {
            const enemyGroup = new THREE.Group();
            enemyGroup.position.set(i === 0 ? -15 : 15, 0, -6);
            scene.add(enemyGroup);

            loader.load('Meshy_AI_Nebula Vanguard_1785730919_image-to-3d-texture-compressed.glb', function (gltf) {
                const humanModel = gltf.scene;
                humanModel.scale.set(0.45, 0.45, 0.45);
                alignModelToGround(humanModel);
                enemyGroup.add(humanModel);
            });

            enemies.push({ 
                mesh: enemyGroup, 
                speedX: (Math.random() - 0.5) * 0.03, 
                speedZ: (Math.random() - 0.5) * 0.03,
                shootCooldown: Math.random() * 80 + 40 
            });
        }

        // Main Snail Character
        const snailGroup = new THREE.Group();
        scene.add(snailGroup);
        snailGroup.position.set(0, 0, 10);

        loader.load('Meshy_AI_Astral Knight of the Cosmic Shell_1781887443_image-to-3d-texture-compressed.glb', function (gltf) {
            const character = gltf.scene;
            character.scale.set(0.45, 0.45, 0.45);
            alignModelToGround(character);
            snailGroup.add(character);
        });

        // Game State Variables
        let moveX = 0, moveZ = 0;
        let score = 0;
        let health = 100;
        let carriedBabies = [];
        let timeLeft = 45;
        let freezeTimer = 0;
        let gameOver = false;

        setInterval(() => {
            if (!gameOver && timeLeft > 0) {
                timeLeft--;
                document.getElementById('timer').innerText = timeLeft;
                if (timeLeft === 0 && score < 2) {
                    endGame("TIME UP - MISSION FAILED");
                }
            }
        }, 1000);

        // Joystick Controls
        const stick = document.getElementById('left-stick');
        const knob = document.getElementById('left-knob');
        const maxDist = 35;
        let activeTouchId = null;

        stick.addEventListener('touchstart', (e) => {
            const touch = e.changedTouches[0];
            activeTouchId = touch.identifier;
            updateStick(touch);
        });
        window.addEventListener('touchmove', (e) => {
            for (let i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === activeTouchId) updateStick(e.changedTouches[i]);
            }
        });
        window.addEventListener('touchend', (e) => {
            for (let i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === activeTouchId) {
                    activeTouchId = null;
                    knob.style.transform = `translate(0px, 0px)`;
                    moveX = 0; moveZ = 0;
                }
            }
        });
        function updateStick(touch) {
            const r = stick.getBoundingClientRect();
            let x = touch.clientX - r.left - (r.width / 2);
            let y = touch.clientY - r.top - (r.height / 2);
            const dist = Math.sqrt(x * x + y * y);
            if (dist > maxDist) { x = (x / dist) * maxDist; y = (y / dist) * maxDist; }
            knob.style.transform = `translate(${x}px, ${y}px)`;
            moveX = x / maxDist;
            moveZ = y / maxDist;
        }

        function updateHealthBar() {
            const fill = document.getElementById('health-fill');
            fill.style.width = Math.max(0, health) + '%';
            fill.style.background = health < 30 ? '#ff3300' : '#00ffcc';
        }

        function endGame(message) {
            gameOver = true;
            document.getElementById('status-text').innerText = message;
            document.getElementById('status-screen').style.display = 'flex';
        }

        function canMoveTo(nextX, nextZ) {
            const playerBox = new THREE.Box3(
                new THREE.Vector3(nextX - 0.7, 0, nextZ - 0.7),
                new THREE.Vector3(nextX + 0.7, 2, nextZ + 0.7)
            );
            for (let box of wallBoundingBoxes) {
                if (playerBox.intersectsBox(box)) return false;
            }
            return true;
        }

        function animate() {
            requestAnimationFrame(animate);
            if (gameOver) return;

            if (freezeTimer > 0) {
                freezeTimer -= 0.016;
                document.getElementById('player-status').innerText = "FROZEN (" + Math.ceil(freezeTimer) + "s)";
                document.getElementById('player-status').style.color = "#ffcc00";
            } else {
                document.getElementById('player-status').innerText = "Active";
                document.getElementById('player-status').style.color = "#00ffcc";

                let nextX = snailGroup.position.x + (moveX * 0.1);
                let nextZ = snailGroup.position.z + (moveZ * 0.1);

                if (canMoveTo(nextX, snailGroup.position.z)) snailGroup.position.x = nextX;
                if (canMoveTo(snailGroup.position.x, nextZ)) snailGroup.position.z = nextZ;

                if (moveX !== 0 || moveZ !== 0) {
                    snailGroup.rotation.y = Math.atan2(moveX, moveZ);
                }
            }

            // Move Bell Hazard
            bellGroup.position.add(bellVelocity);
            if (Math.abs(bellGroup.position.x) > 18) bellVelocity.x *= -1;
            if (Math.abs(bellGroup.position.z) > 18) bellVelocity.z *= -1;
            bellGroup.rotation.y += 0.02;

            if (freezeTimer <= 0 && snailGroup.position.distanceTo(bellGroup.position) < 1.8) {
                freezeTimer = 4.0; 
            }

            // Enemy Movement & Wall Bounding Check
            enemies.forEach(en => {
                let nextEnX = en.mesh.position.x + en.speedX;
                let nextEnZ = en.mesh.position.z + en.speedZ;

                let enemyBox = new THREE.Box3(
                    new THREE.Vector3(nextEnX - 0.6, 0, nextEnZ - 0.6),
                    new THREE.Vector3(nextEnX + 0.6, 2, nextEnZ + 0.6)
                );

                let hitWall = false;
                for (let box of wallBoundingBoxes) {
                    if (enemyBox.intersectsBox(box)) {
                        hitWall = true;
                        break;
                    }
                }

                if (hitWall || Math.abs(nextEnX) > 18) {
                    en.speedX *= -1;
                } else {
                    en.mesh.position.x = nextEnX;
                }

                if (hitWall || Math.abs(nextEnZ) > 18) {
                    en.speedZ *= -1;
                } else {
                    en.mesh.position.z = nextEnZ;
                }

                en.shootCooldown--;
                if (en.shootCooldown <= 0) {
                    en.shootCooldown = 100 + Math.random() * 60;
                    const bullet = new THREE.Mesh(bulletGeo, bulletMat);
                    bullet.position.copy(en.mesh.position);
                    bullet.position.y = 0.8;
                    const dir = new THREE.Vector3().subVectors(snailGroup.position, en.mesh.position).normalize();
                    scene.add(bullet);
                    bullets.push({ mesh: bullet, dir: dir, speed: 0.10 });
                }
            });

            // Bullet Movement & Wall Collision
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.mesh.position.addScaledVector(b.dir, b.speed);

                let bulletBox = new THREE.Box3().setFromObject(b.mesh);
                let hitWall = false;

                for (let wallBox of wallBoundingBoxes) {
                    if (bulletBox.intersectsBox(wallBox)) {
                        hitWall = true;
                        break;
                    }
                }

                if (hitWall) {
                    scene.remove(b.mesh);
                    bullets.splice(i, 1);
                    continue;
                }

                let distToPlayer = b.mesh.position.distanceTo(snailGroup.position);

                if (distToPlayer < 0.9) {
                    health = Math.max(0, health - 15);
                    updateHealthBar();
                    scene.remove(b.mesh);
                    bullets.splice(i, 1);
                    if (health <= 0) endGame("GAME OVER - SHOT DOWN");
                    continue;
                }

                if (Math.abs(b.mesh.position.x) > 25 || Math.abs(b.mesh.position.z) > 25) {
                    scene.remove(b.mesh);
                    bullets.splice(i, 1);
                }
            }

            // Room Rescue
            rooms.forEach(room => {
                if (!room.rescued && room.babyMesh && snailGroup.position.distanceTo(room.mesh.position) < 3.0) {
                    room.rescued = true;
                    room.mesh.visible = false;
                    carriedBabies.push(room.babyMesh);
                }
            });

            // Trail behind player
            for (let i = 0; i < carriedBabies.length; i++) {
                let baby = carriedBabies[i];
                let targetPos = snailGroup.position.clone().add(new THREE.Vector3(0, 0, 1.2 + (i * 0.8)).applyAxisAngle(new THREE.Vector3(0,1,0), snailGroup.rotation.y));
                baby.position.lerp(targetPos, 0.1);
            }

            // Drop Off
            if (carriedBabies.length > 0 && snailGroup.position.distanceTo(homeBaseGroup.position) < 3.5) {
                score += carriedBabies.length;
                document.getElementById('score').innerText = score;
                
                carriedBabies.forEach(baby => scene.remove(baby));
                carriedBabies = [];

                if (score >= 2) {
                    endGame("LEVEL 1 VICTORY!");
                }
            }

            camera.position.x = snailGroup.position.x;
            camera.position.z = snailGroup.position.z + 10;
            camera.lookAt(snailGroup.position.x, snailGroup.position.y + 0.5, snailGroup.position.z);

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
