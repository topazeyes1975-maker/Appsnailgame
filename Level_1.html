<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Armored Snail: Level 1 Survival</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050508; font-family: sans-serif; touch-action: none; }
        #ui { position: absolute; top: 10px; left: 10px; color: #00ffcc; font-size: 15px; font-weight: bold; pointer-events: none; z-index: 10; line-height: 1.5; text-shadow: 0 0 5px rgba(0,255,204,0.4); }
        
        .health-bar-container { width: 160px; height: 14px; background: rgba(255,255,255,0.1); border: 2px solid #00ffcc; border-radius: 4px; overflow: hidden; display: inline-block; vertical-align: middle; margin-left: 5px; }
        #health-fill { width: 100%; height: 100%; background: #00ffcc; transition: width 0.2s ease; box-shadow: 0 0 8px #00ffcc; }

        .joystick { 
            position: absolute; 
            bottom: 30px; 
            width: 120px; 
            height: 120px; 
            background: rgba(5, 5, 8, 0.75); 
            border: 3px solid #00ffcc; 
            border-radius: 50%; 
            pointer-events: auto; 
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.5), inset 0 0 10px rgba(0, 0, 0, 0.8);
        }
        #left-stick { left: 30px; }
        #right-stick { right: 30px; }
        
        .stick-knob { 
            position: absolute; 
            top: 35px; 
            left: 35px; 
            width: 50px; 
            height: 50px; 
            background: #00ffcc; 
            border: 2px solid #050508;
            border-radius: 50%; 
            pointer-events: none; 
            box-shadow: 0 0 12px #00ffcc; 
        }
        
        #status-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5,5,8,0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; color: #00ffcc; font-size: 28px; font-weight: bold; z-index: 100; text-align: center; display: none; text-shadow: 0 0 10px #00ffcc; }
        #status-screen button { margin-top: 20px; padding: 12px 24px; background: #00ffcc; border: none; color: #050508; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="ui">
        Objective: Rescue Babies &amp; Survive!<br>
        Babies: <span id="score">0</span>/2 | Status: <span id="player-status">Active</span><br>
        Health: <div class="health-bar-container"><div id="health-fill"></div></div><br>
        Time Left: <span id="timer">45</span>
    </div>
    
    <div id="left-stick" class="joystick"><div id="left-knob" class="stick-knob"></div></div>
    <div id="right-stick" class="joystick"><div id="right-knob" class="stick-knob"></div></div>

    <div id="status-screen">
        <div id="status-text">MISSION COMPLETE</div>
        <button onclick="location.reload()">Play Again</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050508);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 16, 14);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
        scene.add(ambientLight);
        
        const dirLight = new THREE.DirectionalLight(0x00ffcc, 1.5);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // Texture Loader
        const textureLoader = new THREE.TextureLoader();
        textureLoader.setCrossOrigin('anonymous');

        // Floor Setup
        const floorTexture = textureLoader.load('1785671824766.png', function(tex) {
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(8, 8);
            tex.needsUpdate = true;
        });

        const floorGeo = new THREE.PlaneGeometry(100, 100);
        const floorMat = new THREE.MeshStandardMaterial({ 
            map: floorTexture,
            color: 0xffffff,
            roughness: 0.8, 
            metalness: 0.2 
        });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -0.05;
        scene.add(floor);

        const floorGrid = new THREE.GridHelper(60, 30, 0x00ffcc, 0x1a1a3a);
        floorGrid.position.y = 0.01;
        scene.add(floorGrid);

        // Home Base
        const baseGeo = new THREE.BoxGeometry(4, 0.1, 4);
        const baseMat = new THREE.MeshStandardMaterial({ color: 0x00ffcc, emissive: 0x00ffcc, emissiveIntensity: 0.3 });
        const homeBase = new THREE.Mesh(baseGeo, baseMat);
        homeBase.position.set(0, 0.02, 10);
        scene.add(homeBase);

        // Walls Setup
        const wallTexture = textureLoader.load('1785672040480.png', function(tex) {
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(2, 1);
            tex.needsUpdate = true;
        });

        const obstacleMat = new THREE.MeshStandardMaterial({ 
            map: wallTexture,
            color: 0xffffff,
            roughness: 0.4, 
            metalness: 0.5 
        });

        const wallBoundingBoxes = [];

        function createWall(x, z, width, depth) {
            const wallGeo = new THREE.BoxGeometry(width, 2.5, depth);
            const wall = new THREE.Mesh(wallGeo, obstacleMat);
            wall.position.set(x, 1.25, z);
            scene.add(wall);

            const edges = new THREE.EdgesGeometry(wallGeo);
            const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x00ffcc }));
            line.position.copy(wall.position);
            scene.add(line);

            const box = new THREE.Box3().setFromObject(wall);
            wallBoundingBoxes.push(box);
        }

        // Map Layout
        createWall(0, -22, 44, 2);
        createWall(-22, 0, 2, 44);
        createWall(22, 0, 2, 44);
        createWall(0, 22, 44, 2);

        createWall(-8, -10, 2, 16);
        createWall(8, -10, 2, 16);
        createWall(0, -2, 14, 2);
        createWall(-12, 6, 12, 2);
        createWall(12, 6, 12, 2);

        // Containment Cages
        const roomGeo = new THREE.BoxGeometry(2.5, 2.5, 2.5);
        const roomMat = new THREE.MeshStandardMaterial({ color: 0xff0055, emissive: 0xff0055, emissiveIntensity: 0.5, wireframe: true });
        
        const room1 = new THREE.Mesh(roomGeo, roomMat);
        room1.position.set(-14, 1.25, -14);
        scene.add(room1);

        const room2 = new THREE.Mesh(roomGeo, roomMat);
        room2.position.set(14, 1.25, -14);
        scene.add(room2);

        const loader = new THREE.GLTFLoader();

        const fallbackBabyGeo = new THREE.SphereGeometry(0.6, 16, 16);
        const fallbackBabyMat = new THREE.MeshStandardMaterial({ color: 0xff0055, emissive: 0xff0055, emissiveIntensity: 0.8 });

        function createFallbackBaby(x, z) {
            const mesh = new THREE.Mesh(fallbackBabyGeo, fallbackBabyMat);
            mesh.position.set(x, 0.6, z);
            scene.add(mesh);
            return mesh;
        }

        // Initialize rooms array with immediate fallback objects
        const rooms = [
            { mesh: room1, babyMesh: createFallbackBaby(-14, -14), rescued: false },
            { mesh: room2, babyMesh: createFallbackBaby(14, -14), rescued: false }
        ];

        loader.load('Meshy_AI_Galactic Snail_1785475444_image-to-3d-texture-compressed.glb', function (gltf) {
            const template = gltf.scene;
            
            // Swap out fallbacks if models load successfully
            if (rooms[0].babyMesh) scene.remove(rooms[0].babyMesh);
            if (rooms[1].babyMesh) scene.remove(rooms[1].babyMesh);

            const b1 = template.clone();
            b1.scale.set(0.5, 0.5, 0.5);
            b1.position.set(-14, 0.3, -14);
            scene.add(b1);
            rooms[0].babyMesh = b1;

            const b2 = template.clone();
            b2.scale.set(0.5, 0.5, 0.5);
            b2.position.set(14, 0.3, -14);
            scene.add(b2);
            rooms[1].babyMesh = b2;
        }, undefined, function (error) {
            console.error("Galactic Snail model load error, using fallbacks:", error);
        });

        // --- 3D MAGIC BELL HAZARD SETUP ---
        const bellGroup = new THREE.Group();
        bellGroup.position.set(0, 1, -10);
        scene.add(bellGroup);

        const fallbackBellGeo = new THREE.SphereGeometry(0.8, 16, 16);
        const fallbackBellMat = new THREE.MeshStandardMaterial({ color: 0xffff00, emissive: 0xaa8800 });
        const fallbackBell = new THREE.Mesh(fallbackBellGeo, fallbackBellMat);
        bellGroup.add(fallbackBell);

        const bellVelocity = new THREE.Vector3(0.08, 0, 0.05);

        loader.load('Meshy_AI_Neon_Liberty_Bell_1785740945_image-to-3d-texture_compressed.glb', function (gltf) {
            bellGroup.remove(fallbackBell);
            const bellModel = gltf.scene;
            bellModel.scale.set(0.8, 0.8, 0.8);
            bellGroup.add(bellModel);
        }, undefined, function (error) {
            console.error("Bell load error:", error);
        });

        // --- 3D HUMAN WALKERS & BULLETS SETUP ---
        const bullets = [];
        const bulletGeo = new THREE.SphereGeometry(0.2, 8, 8);
        const bulletMat = new THREE.MeshStandardMaterial({ color: 0xff0055, emissive: 0xff0055 });

        const enemies = [];
        const enemyGroup = new THREE.Group();
        enemyGroup.position.set(-10, 0, 5);
        scene.add(enemyGroup);

        const fallbackEnemyGeo = new THREE.CylinderGeometry(0.5, 0.5, 1.8);
        const fallbackEnemyMat = new THREE.MeshStandardMaterial({ color: 0xff0000 });
        const fallbackEnemy = new THREE.Mesh(fallbackEnemyGeo, fallbackEnemyMat);
        fallbackEnemy.position.y = 0.9;
        enemyGroup.add(fallbackEnemy);

        enemies.push({
            group: enemyGroup,
            speedX: 0.06,
            speedZ: 0.04,
            shootCooldown: 60
        });

        loader.load('Meshy_AI_Nebula_Vanguard_1785730919_image-to-3d-texture_compressed.glb', function (gltf) {
            enemyGroup.remove(fallbackEnemy);
            const humanModel = gltf.scene;
            humanModel.scale.set(0.8, 0.8, 0.8);
            enemyGroup.add(humanModel);
        }, undefined, function (error) {
            console.error("Human Walker load error:", error);
        });

        // Main Character Snail Group
        const snailGroup = new THREE.Group();
        scene.add(snailGroup);
        snailGroup.position.set(0, 0, 10);

        // Shield
        const shieldGeo = new THREE.SphereGeometry(1.6, 32, 32);
        const shieldMat = new THREE.MeshPhysicalMaterial({ 
            color: 0x00ffff, 
            transparent: true, 
            opacity: 0.45, 
            roughness: 0.1, 
            metalness: 0.9,
            clearcoat: 1.0, 
            clearcoatRoughness: 0.1,
            emissive: 0x00aaff,
            emissiveIntensity: 0.5
        });
        const reflectiveShield = new THREE.Mesh(shieldGeo, shieldMat);
        reflectiveShield.position.y = 0.8;
        snailGroup.add(reflectiveShield);

        // Fallback Main Snail
        const fallbackMainGeo = new THREE.BoxGeometry(1, 1, 1);
        const fallbackMainMat = new THREE.MeshStandardMaterial({ color: 0x00ffcc, emissive: 0x00ffcc });
        const fallbackMain = new THREE.Mesh(fallbackMainGeo, fallbackMainMat);
        fallbackMain.position.y = 0.5;
        snailGroup.add(fallbackMain);

        loader.load('Meshy_AI_Doorway to Time_1785740856_image-to-3d-texture-compressed.glb', function (gltf) {
            snailGroup.remove(fallbackMain);
            const character = gltf.scene;
            character.scale.set(0.8, 0.8, 0.8);
            character.position.y = 0.9; 
            snailGroup.add(character);
        }, undefined, function (error) {
            console.error("Astral Knight model load error:", error);
        });

        // Game State
        let moveX = 0, moveZ = 0;
        let isShieldActive = false;
        let score = 0;
        let health = 100;
        let carriedBabies = [];
        let timeLeft = 45;
        let freezeTimer = 0;
        let gameOver = false;

        setInterval(() => {
            if (!gameOver && timeLeft > 0) {
                timeLeft--;
                document.getElementById('timer').innerText = timeLeft;
                if (timeLeft === 0 && score < 2) {
                    endGame("TIME UP - MISSION FAILED");
                }
            }
        }, 1000);

        function setupJoystick(stickId, knobId, callback) {
            const stick = document.getElementById(stickId);
            const knob = document.getElementById(knobId);
            const maxDist = 35;
            let activeTouchId = null;

            stick.addEventListener('touchstart', (e) => {
                const touch = e.changedTouches[0];
                activeTouchId = touch.identifier;
                updateStick(touch);
            });
            window.addEventListener('touchmove', (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === activeTouchId) updateStick(e.changedTouches[i]);
                }
            });
            window.addEventListener('touchend', (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === activeTouchId) {
                        activeTouchId = null;
                        knob.style.transform = `translate(0px, 0px)`;
                        callback(0, 0);
                    }
                }
            });
            function updateStick(touch) {
                const r = stick.getBoundingClientRect();
                let x = touch.clientX - r.left - (r.width / 2);
                let y = touch.clientY - r.top - (r.height / 2);
                const dist = Math.sqrt(x * x + y * y);
                if (dist > maxDist) { x = (x / dist) * maxDist; y = (y / dist) * maxDist; }
                knob.style.transform = `translate(${x}px, ${y}px)`;
                callback(x / maxDist, y / maxDist);
            }
        }

        setupJoystick('left-stick', 'left-knob', (x, y) => { moveX = x; moveZ = y; });
        
        setupJoystick('right-stick', 'right-knob', (x, y) => {
            if ((Math.abs(x) > 0.3 || Math.abs(y) > 0.3) && freezeTimer <= 0) {
                isShieldActive = true;
                reflectiveShield.scale.set(1.3, 1.3, 1.3);
                shieldMat.emissiveIntensity = 1.0;
            } else {
                isShieldActive = false;
                reflectiveShield.scale.set(1.0, 1.0, 1.0);
                shieldMat.emissiveIntensity = 0.4;
            }
        });

        function updateHealthBar() {
            const fill = document.getElementById('health-fill');
            fill.style.width = Math.max(0, health) + '%';
            fill.style.background = health < 30 ? '#ff3300' : '#00ffcc';
        }

        function endGame(message) {
            gameOver = true;
            document.getElementById('status-text').innerText = message;
            document.getElementById('status-screen').style.display = 'flex';
        }

        function canMoveTo(nextX, nextZ) {
            const playerBox = new THREE.Box3(
                new THREE.Vector3(nextX - 0.7, 0, nextZ - 0.7),
                new THREE.Vector3(nextX + 0.7, 2, nextZ + 0.7)
            );
            for (let box of wallBoundingBoxes) {
                if (playerBox.intersectsBox(box)) return false;
            }
            return true;
        }

        // Main Loop
        function animate() {
            requestAnimationFrame(animate);
            if (gameOver) return;

            // Handle Freeze
            if (freezeTimer > 0) {
                freezeTimer -= 0.016;
                isShieldActive = false;
                reflectiveShield.scale.set(1.0, 1.0, 1.0);
                shieldMat.emissiveIntensity = 0.4;

                document.getElementById('player-status').innerText = "FROZEN (" + Math.ceil(freezeTimer) + "s)";
                document.getElementById('player-status').style.color = "#ffcc00";
            } else {
                document.getElementById('player-status').innerText = isShieldActive ? "SHIELD ACTIVE" : "Active";
                document.getElementById('player-status').style.color = isShieldActive ? "#00ffff" : "#00ffcc";

                let nextX = snailGroup.position.x + (moveX * 0.1);
                let nextZ = snailGroup.position.z + (moveZ * 0.1);

                if (canMoveTo(nextX, snailGroup.position.z)) snailGroup.position.x = nextX;
                if (canMoveTo(snailGroup.position.x, nextZ)) snailGroup.position.z = nextZ;

                if (moveX !== 0 || moveZ !== 0) {
                    snailGroup.rotation.y = Math.atan2(moveX, moveZ);
                }
            }

            reflectiveShield.rotation.y += 0.02;

            // Move Floating 3D Bell
            bellGroup.position.add(bellVelocity);
            if (Math.abs(bellGroup.position.x) > 18) bellVelocity.x *= -1;
            if (Math.abs(bellGroup.position.z) > 18) bellVelocity.z *= -1;
            bellGroup.rotation.y += 0.03;

            // Bell Collision Check
            if (freezeTimer <= 0 && snailGroup.position.distanceTo(bellGroup.position) < 1.8) {
                freezeTimer = 5.0; 
            }

            // Move Human Walkers & Shoot Bullets
            enemies.forEach(en => {
                en.group.position.x += en.speedX;
                en.group.position.z += en.speedZ;
                if (Math.abs(en.group.position.x) > 18) en.speedX *= -1;
                if (Math.abs(en.group.position.z) > 18) en.speedZ *= -1;

                if (en.speedX !== 0 || en.speedZ !== 0) {
                    en.group.rotation.y = Math.atan2(en.speedX, en.speedZ);
                }

                en.shootCooldown--;
                if (en.shootCooldown <= 0) {
                    en.shootCooldown = 90 + Math.random() * 60;
                    const bullet = new THREE.Mesh(bulletGeo, bulletMat);
                    bullet.position.copy(en.group.position);
                    bullet.position.y = 1.0;
                    const dir = new THREE.Vector3().subVectors(snailGroup.position, en.group.position).normalize();
                    scene.add(bullet);
                    bullets.push({ mesh: bullet, dir: dir, speed: 0.14 });
                }
            });
// Bullets Collision Logic
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.mesh.position.addScaledVector(b.dir, b.speed);

                let bulletBox = new THREE.Box3().setFromObject(b.mesh);
                let hitWall = false;

                for (let wallBox of wallBoundingBoxes) {
                    if (bulletBox.intersectsBox(wallBox)) {
                        b.dir.negate();
                        hitWall = true;
                        break;
                    }
                }

                if (hitWall) continue;

                let distToPlayer = b.mesh.position.distanceTo(snailGroup.position);

                if (isShieldActive && distToPlayer < 2.0) {
                    b.dir.negate();
                    b.speed *= 1.2;
                    b.mesh.material.color.setHex(0x00ffff);
                    continue;
                } 
                else if (!isShieldActive && distToPlayer < 1.2) {
                    health = Math.max(0, health - 15);
                    updateHealthBar();
                    scene.remove(b.mesh);
                    bullets.splice(i, 1);
                    if (health <= 0) endGame("GAME OVER - SHOT DOWN");
                    continue;
                }

                if (Math.abs(b.mesh.position.x) > 25 || Math.abs(b.mesh.position.z) > 25) {
                    scene.remove(b.mesh);
                    bullets.splice(i, 1);
                }
            }

            // Room Rescue Mechanics (CANNOT RESCUE WHILE SHIELD IS ACTIVE)
            rooms.forEach(room => {
                if (!room.rescued && room.babyMesh && !isShieldActive && snailGroup.position.distanceTo(room.mesh.position) < 3.0) {
                    room.rescued = true;
                    room.mesh.visible = false;
                    carriedBabies.push(room.babyMesh);
                }
            });

            // Trail behind main character
            for (let i = 0; i < carriedBabies.length; i++) {
                let baby = carriedBabies[i];
                let targetPos = snailGroup.position.clone().add(new THREE.Vector3(0, 0, 1.5 + (i * 1.0)).applyAxisAngle(new THREE.Vector3(0,1,0), snailGroup.rotation.y));
                baby.position.lerp(targetPos, 0.1);
                baby.position.y = 0.3;
            }

            // Home Base Rescue Check
            if (carriedBabies.length > 0 && snailGroup.position.distanceTo(homeBase.position) < 3.5) {
                score += carriedBabies.length;
                document.getElementById('score').innerText = score;
                
                carriedBabies.forEach(baby => scene.remove(baby));
                carriedBabies = [];

                if (score >= 2) {
                    endGame("LEVEL 1 VICTORY!");
                }
            }

            // Camera Tracking
            camera.position.x = snailGroup.position.x;
            camera.position.z = snailGroup.position.z + 14;
            camera.lookAt(snailGroup.position.x, snailGroup.position.y, snailGroup.position.z);

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
