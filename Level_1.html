<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Armored Snail: Level 1 Survival</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050508; font-family: sans-serif; touch-action: none; user-select: none; }
        #ui { position: absolute; top: 10px; left: 10px; color: #00ffcc; font-size: 15px; font-weight: bold; pointer-events: none; z-index: 10; line-height: 1.5; text-shadow: 0 0 5px rgba(0,255,204,0.4); }
        
        .health-bar-container { width: 160px; height: 14px; background: rgba(255,255,255,0.1); border: 2px solid #00ffcc; border-radius: 4px; overflow: hidden; display: inline-block; vertical-align: middle; margin-left: 5px; }
        #health-fill { width: 100%; height: 100%; background: #00ffcc; transition: width 0.2s ease; box-shadow: 0 0 8px #00ffcc; }

        #radar { position: absolute; top: 10px; right: 10px; border: 2px solid #00ffcc; border-radius: 50%; background: rgba(5, 5, 8, 0.85); box-shadow: 0 0 10px rgba(0,255,204,0.4); z-index: 10; }

        .joystick { 
            position: absolute; 
            bottom: 30px; 
            left: 30px;
            width: 120px; 
            height: 120px; 
            background: rgba(5, 5, 8, 0.75); 
            border: 3px solid #00ffcc; 
            border-radius: 50%; 
            pointer-events: auto; 
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.5), inset 0 0 10px rgba(0, 0, 0, 0.8);
        }

        .stick-knob { 
            position: absolute; 
            top: 35px; 
            left: 35px; 
            width: 50px; 
            height: 50px; 
            background: #00ffcc; 
            border: 2px solid #050508;
            border-radius: 50%; 
            pointer-events: none; 
            box-shadow: 0 0 12px #00ffcc; 
        }

        #game-over-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(10, 10, 25, 0.95);
            border: 2px solid #00ffcc;
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            color: white;
            display: none;
            flex-direction: column;
            gap: 15px;
            z-index: 100;
            pointer-events: auto;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.4);
            min-width: 280px;
        }

        .star-rating {
            font-size: 32px;
            color: #444;
            letter-spacing: 5px;
        }

        .star-gold {
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
        }

        .modal-btn {
            border: none;
            color: white;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }

        #btn-next-level {
            background: #00ffcc;
            color: #050508;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.6);
        }

        #btn-restart {
            background: #ff007f;
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.6);
        }
    </style>
</head>
<body>
    <div id="ui">
        Objective: Rescue Babies & Survive!<br>
        Babies: <span id="score">0</span>/2 | Status: <span id="player-status">Active</span><br>
        Health: <div class="health-bar-container"><div id="health-fill"></div></div><br>
        Time Left: <span id="timer">45</span>
    </div>

    <!-- Mini-Map Canvas -->
    <canvas id="radar" width="80" height="80"></canvas>
    
    <div id="left-stick" class="joystick"><div id="left-knob" class="stick-knob"></div></div>

    <div id="game-over-modal">
        <h2 id="modal-title" style="margin:0; color:#00ffcc;">LEVEL 1 VICTORY!</h2>
        <div id="star-container" class="star-rating">★ ★ ★</div>
        <p id="modal-msg">You safely returned all baby snails home!</p>
        <button id="btn-next-level" class="modal-btn" onclick="goToNextLevel()">NEXT LEVEL</button>
        <button id="btn-restart" class="modal-btn" onclick="retryCurrentLevel()">RETRY LEVEL</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050508);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 8, 10);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const loader = new THREE.GLTFLoader();
        const textureLoader = new THREE.TextureLoader();

        function alignModelToGround(model) {
            const box = new THREE.Box3().setFromObject(model);
            model.position.y -= box.min.y;
        }

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
        scene.add(ambientLight);
        
        const dirLight = new THREE.DirectionalLight(0x00ffcc, 1.8);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // Ground Image Texture Loading
        const floorTexture = textureLoader.load('1785671824766.png', function (tex) {
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(12, 12);
        });

        const floorGeo = new THREE.PlaneGeometry(100, 100);
        const floorMat = new THREE.MeshStandardMaterial({ 
            map: floorTexture,
            roughness: 0.8, 
            metalness: 0.2 
        });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = 0;
        scene.add(floor);

        // Wall Image Texture Loading
        const wallTexture = textureLoader.load('1787589407750~2.jpg', function (tex) {
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(2, 1);
        });

        const obstacleMat = new THREE.MeshStandardMaterial({ map: wallTexture, roughness: 0.4, metalness: 0.5 });
        const wallBoundingBoxes = [];

        function createWall(x, z, width, depth) {
            const wallGeo = new THREE.BoxGeometry(width, 2.5, depth);
            const wall = new THREE.Mesh(wallGeo, obstacleMat);
            wall.position.set(x, 1.25, z);
            scene.add(wall);

            const edges = new THREE.EdgesGeometry(wallGeo);
            const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x00ffcc }));
            line.position.copy(wall.position);
            scene.add(line);

            const box = new THREE.Box3().setFromObject(wall);
            wallBoundingBoxes.push(box);
        }

        createWall(0, -22, 44, 2);
        createWall(-22, 0, 2, 44);
        createWall(22, 0, 2, 44);
        createWall(0, 22, 44, 2);
        createWall(-8, -10, 2, 16);
        createWall(8, -10, 2, 16);
        createWall(0, -2, 14, 2);
        createWall(-12, 6, 12, 2);
        createWall(12, 6, 12, 2);

        // Home Base Model
        const homeBaseGroup = new THREE.Group();
        homeBaseGroup.position.set(1, 0, 1);
        scene.add(homeBaseGroup);

        const baseGeo = new THREE.BoxGeometry(4, 0.1, 4);
        const baseMat = new THREE.MeshStandardMaterial({ color: 0x00ffcc, emissive: 0x00ffcc, emissiveIntensity: 0.3 });
        const fallbackBase = new THREE.Mesh(baseGeo, baseMat);
        homeBaseGroup.add(fallbackBase);

        loader.load('Meshy_AI_Cosmic Vortex Gate_1786036249_texture_converted.glb', function (gltf) {
            homeBaseGroup.remove(fallbackBase);
            const baseModel = gltf.scene;
            baseModel.scale.set(1.5, 1.5, 1.5);
            alignModelToGround(baseModel);
            homeBaseGroup.add(baseModel);
        });

        // Baby Containment Cages
        const roomGeo = new THREE.BoxGeometry(2.5, 2.5, 2.5);
        const roomMat = new THREE.MeshStandardMaterial({ color: 0xff0055, emissive: 0xff0055, emissiveIntensity: 0.5, wireframe: true });
        
        const room1 = new THREE.Mesh(roomGeo, roomMat);
        room1.position.set(-14, 1.25, -14);
        scene.add(room1);

        const room2 = new THREE.Mesh(roomGeo, roomMat);
        room2.position.set(14, 1.25, -14);
        scene.add(room2);

        const rooms = [];

        loader.load('Meshy_AI_Galactic Snail_1785475444_image-to-3d-texture-compressed.glb', function (gltf) {
            const babyModel1 = gltf.scene.clone();
            babyModel1.scale.set(0.35, 0.35, 0.35);
            alignModelToGround(babyModel1);
            babyModel1.position.x = -14;
            babyModel1.position.z = -14;
            scene.add(babyModel1);

            const babyModel2 = gltf.scene.clone();
            babyModel2.scale.set(0.35, 0.35, 0.35);
            alignModelToGround(babyModel2);
            babyModel2.position.x = 14;
            babyModel2.position.z = -14;
            scene.add(babyModel2);

            rooms.push({ mesh: room1, babyMesh: babyModel1, rescued: false });
            rooms.push({ mesh: room2, babyMesh: babyModel2, rescued: false });
        });

        // Magic Bell Hazard
        const bellGroup = new THREE.Group();
        bellGroup.position.set(0, 0, -8);
        scene.add(bellGroup);

        loader.load('Meshy_AI_Neon Liberty Bell_1785740945_image-to-3d-texture-compressed.glb', function (gltf) {
            const bellModel = gltf.scene;
            bellModel.scale.set(0.45, 0.45, 0.45);
            alignModelToGround(bellModel);
            bellGroup.add(bellModel);
        });

        let bellVelocity = new THREE.Vector3(0.04, 0, 0.03);

        // Enemy Shooters
        const enemies = [];
        const bullets = [];
        const bulletGeo = new THREE.SphereGeometry(0.25, 8, 8);
        const bulletMat = new THREE.MeshStandardMaterial({ color: 0xff3300, emissive: 0xff3300, emissiveIntensity: 1.0 });

        for (let i = 0; i < 2; i++) {
            const enemyGroup = new THREE.Group();
            enemyGroup.position.set(i === 0 ? -15 : 15, 0, -6);
            scene.add(enemyGroup);

            loader.load('Meshy_AI_Nebula Vanguard_1785730919_image-to-3d-texture-compressed.glb', function (gltf) {
                const humanModel = gltf.scene;
                humanModel.scale.set(0.45, 0.45, 0.45);
                alignModelToGround(humanModel);
                enemyGroup.add(humanModel);
            });

            enemies.push({ 
                mesh: enemyGroup, 
                speedX: (Math.random() - 0.5) * 0.05 + 0.02, 
                speedZ: (Math.random() - 0.5) * 0.05 + 0.02,
                shootCooldown: Math.random() * 80 + 40 
            });
        }

        // Main Snail Character
        const snailGroup = new THREE.Group();
        scene.add(snailGroup);
        snailGroup.position.set(0, 0, 10);

        loader.load('Meshy_AI_Astral Knight of the Cosmic Shell_1781887443_image-to-3d-texture-compressed.glb', function (gltf) {
            const character = gltf.scene;
            character.scale.set(0.45, 0.45, 0.45);
            alignModelToGround(character);
            snailGroup.add(character);
        });

        // Game State Variables
        let moveX = 0, moveZ = 0;
        let score = 0;
        let health = 100;
        let carriedBabies = [];
        let timeLeft = 45;
        let freezeTimer = 0;
        let gameOver = false;

        setInterval(() => {
            if (!gameOver && timeLeft > 0) {
                timeLeft--;
                document.getElementById('timer').innerText = timeLeft;
                if (timeLeft === 0 && score < 2) {
                    endGame(false, "TIME UP - MISSION FAILED");
                }
            }
        }, 1000);

        // Force window focus on desktop
        window.focus();
        window.addEventListener('click', () => { window.focus(); });

        // KEYBOARD CONTROLS
        const keys = { KeyW: false, KeyS: false, KeyA: false, KeyD: false, ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };

        window.addEventListener('keydown', (e) => {
            if (e.code in keys) keys[e.code] = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.code in keys) keys[e.code] = false;
        });

        // Joystick Controls
        const stick = document.getElementById('left-stick');
        const knob = document.getElementById('left-knob');
        const maxDist = 35;
        let activeTouchId = null;

        stick.addEventListener('touchstart', (e) => {
            const touch = e.changedTouches[0];
            activeTouchId = touch.identifier;
            updateStick(touch);
        });
        window.addEventListener('touchmove', (e) => {
            for (let i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === activeTouchId) updateStick(e.changedTouches[i]);
            }
        });
        window.addEventListener('touchend', (e) => {
            for (let i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === activeTouchId) {
                    activeTouchId = null;
                    knob.style.transform = `translate(0px, 0px)`;
                    moveX = 0; moveZ = 0;
                }
            }
        });
        function updateStick(touch) {
            const r = stick.getBoundingClientRect();
            let x = touch.clientX - r.left - (r.width / 2);
            let y = touch.clientY - r.top - (r.height / 2);
            const dist = Math.sqrt(x * x + y * y);
            if (dist > maxDist) { x = (x / dist) * maxDist; y = (y / dist) * maxDist; }
            knob.style.transform = `translate(${x}px, ${y}px)`;
            moveX = x / maxDist;
            moveZ = y / maxDist;
        }

        function updateHealthBar() {
            const fill = document.getElementById('health-fill');
            fill.style.width = Math.max(0, health) + '%';
            fill.style.background = health < 30 ? '#ff3300' : '#00ffcc';
        }

        function endGame(isWin, customMsg) {
            gameOver = true;
            const modal = document.getElementById('game-over-modal');
            const title = document.getElementById('modal-title');
            const msg = document.getElementById('modal-msg');
            const starContainer = document.getElementById('star-container');
            const nextBtn = document.getElementById('btn-next-level');
            const retryBtn = document.getElementById('btn-restart');

            if (isWin) {
                title.innerText = "LEVEL 1 COMPLETE!";
                title.style.color = "#00ffcc";
                msg.innerText = "You successfully escorted all baby snails back to home base!";

                nextBtn.style.display = 'inline-block';
                retryBtn.style.display = 'none';

                let stars = 1;
                if (health >= 80) stars = 3;
                else if (health >= 40) stars = 2;

                let starHTML = '';
                for (let i = 0; i < 3; i++) {
                    if (i < stars) starHTML += '<span class="star-gold">★</span> ';
                    else starHTML += '<span>★</span> ';
                }
                starContainer.innerHTML = starHTML;
                starContainer.style.display = 'block';
            } else {
                title.innerText = customMsg || "MISSION FAILED!";
                title.style.color = "#ff007f";
                msg.innerText = "You didn't make it to home base in time!";
                starContainer.style.display = 'none';

                nextBtn.style.display = 'none';
                retryBtn.style.display = 'inline-block';
            }
            modal.style.display = 'flex';
        }

        function retryCurrentLevel() {
            location.reload();
        }

        function goToNextLevel() {
            window.location.href = 'Level_2.html';
        }

        function canMoveTo(nextX, nextZ) {
            const playerBox = new THREE.Box3(
                new THREE.Vector3(nextX - 0.7, 0, nextZ - 0.7),
                new THREE.Vector3(nextX + 0.7, 2, nextZ + 0.7)
            );
            for (let box of wallBoundingBoxes) {
                if (playerBox.intersectsBox(box)) return false;
            }
            return true;
        }

        function drawRadar() {
            const radarCanvas = document.getElementById('radar');
            const ctx = radarCanvas.getContext('2d');
            ctx.clearRect(0, 0, 80, 80);

            // Draw Snail Dot (Cyan)
            ctx.fillStyle = '#00ffcc';
            ctx.beginPath();
            ctx.arc(40 + (snailGroup.position.x * 1.5), 40 + (snailGroup.position.z * 1.5), 3, 0, Math.PI * 2);
            ctx.fill();

            // Draw Enemies (Red)
            ctx.fillStyle = '#ff0055';
            enemies.forEach(en => {
                ctx.beginPath();
                ctx.arc(40 + (en.mesh.position.x * 1.5), 40 + (en.mesh.position.z * 1.5), 2.5, 0, Math.PI * 2);
                ctx.fill();
            });

            // Draw Home Base (Yellow)
            ctx.fillStyle = '#ffd700';
            ctx.beginPath();
            ctx.arc(40 + (homeBaseGroup.position.x * 1.5), 40 + (homeBaseGroup.position.z * 1.5), 3, 0, Math.PI * 2);
            ctx.fill();
        }

        function animate() {
            requestAnimationFrame(animate);
            if (gameOver) return;

            if (freezeTimer > 0) {
                freezeTimer -= 0.016;
                document.getElementById('player-status').innerText = "FROZEN (" + Math.ceil(freezeTimer) + "s)";
                document.getElementById('player-status').style.color = "#ffcc00";
            } else {
                document.getElementById('player-status').innerText = "Active";
                document.getElementById('player-status').style.color = "#00ffcc";

                // Keyboard Input Check
                let keyX = 0;
                let keyZ = 0;

                if (keys.KeyD || keys.ArrowRight) keyX += 1;
                if (keys.KeyA || keys.ArrowLeft) keyX -= 1;
                if (keys.KeyS || keys.ArrowDown) keyZ += 1;
                if (keys.KeyW || keys.ArrowUp) keyZ -= 1;

                // Normalize diagonal movement for keyboard
                if (keyX !== 0 && keyZ !== 0) {
                    keyX *= 0.7071;
                    keyZ *= 0.7071;
                }

                // Favor keyboard input if pressed, otherwise fallback to touch joystick
                let finalMoveX = (keyX !== 0) ? keyX : moveX;
                let finalMoveZ = (keyZ !== 0) ? keyZ : moveZ;

                let nextX = snailGroup.position.x + (finalMoveX * 0.12);
                let nextZ = snailGroup.position.z + (finalMoveZ * 0.12);

                if (canMoveTo(nextX, snailGroup.position.z)) snailGroup.position.x = nextX;
                if (canMoveTo(snailGroup.position.x, nextZ)) snailGroup.position.z = nextZ;

                if (finalMoveX !== 0 || finalMoveZ !== 0) {
                    snailGroup.rotation.y = Math.atan2(finalMoveX, finalMoveZ);
                }
            }

            // Move Enemies & Shoot
            enemies.forEach(en => {
                let nextEnX = en.mesh.position.x + en.speedX;
                let nextEnZ = en.mesh.position.z + en.speedZ;

                if (Math.abs(nextEnX) > 18) en.speedX *= -1;
                else en.mesh.position.x = nextEnX;

                if (Math.abs(nextEnZ) > 18) en.speedZ *= -1;
                else en.mesh.position.z = nextEnZ;

                en.shootCooldown--;
                if (en.shootCooldown <= 0) {
                    en.shootCooldown = 100 + Math.random() * 60;
                    const bullet = new THREE.Mesh(bulletGeo, bulletMat);
                    bullet.position.copy(en.mesh.position);
                    bullet.position.y = 0.8;
                    const dir = new THREE.Vector3().subVectors(snailGroup.position, en.mesh.position).normalize();
                    scene.add(bullet);
                    bullets.push({ mesh: bullet, dir: dir, speed: 0.10 });
                }
            });

            // Move Bell Hazard
            bellGroup.position.add(bellVelocity);
            if (Math.abs(bellGroup.position.x) > 18) bellVelocity.x *= -1;
            if (Math.abs(bellGroup.position.z) > 18) bellVelocity.z *= -1;
            bellGroup.rotation.y += 0.02;

            if (freezeTimer <= 0 && snailGroup.position.distanceTo(bellGroup.position) < 1.8) {
                freezeTimer = 4.0; 
            }

            // Bullet Movement & Collision
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.mesh.position.addScaledVector(b.dir, b.speed);

                let bulletBox = new THREE.Box3().setFromObject(b.mesh);
                let hitWall = false;

                for (let wallBox of wallBoundingBoxes) {
                    if (bulletBox.intersectsBox(wallBox)) {
                        hitWall = true;
                        break;
                    }
                }

                if (hitWall) {
                    scene.remove(b.mesh);
                    bullets.splice(i, 1);
                    continue;
                }

                let hitDetected = false;

                if (b.mesh.position.distanceTo(snailGroup.position) < 0.9) {
                    hitDetected = true;
                }

                if (!hitDetected) {
                    carriedBabies.forEach(baby => {
                        if (b.mesh.position.distanceTo(baby.position) < 0.6) {
                            hitDetected = true;
                        }
                    });
                }

                if (hitDetected) {
                    health = Math.max(0, health - 15);
                    updateHealthBar();
                    scene.remove(b.mesh);
                    bullets.splice(i, 1);
                    if (health <= 0) endGame(false, "GAME OVER - SHOT DOWN");
                    continue;
                }

                if (Math.abs(b.mesh.position.x) > 25 || Math.abs(b.mesh.position.z) > 25) {
                    scene.remove(b.mesh);
                    bullets.splice(i, 1);
                }
            }

            // Room Rescue
            rooms.forEach(room => {
                if (!room.rescued && room.babyMesh && snailGroup.position.distanceTo(room.mesh.position) < 3.0) {
                    room.rescued = true;
                    room.mesh.visible = false;
                    carriedBabies.push(room.babyMesh);
                }
            });

            // Trail behind player
            for (let i = 0; i < carriedBabies.length; i++) {
                let baby = carriedBabies[i];
                let targetPos = snailGroup.position.clone().add(new THREE.Vector3(0, 0, 1.2 + (i * 0.8)).applyAxisAngle(new THREE.Vector3(0,1,0), snailGroup.rotation.y));
                baby.position.lerp(targetPos, 0.1);
            }

            // Drop Off
            if (carriedBabies.length > 0 && snailGroup.position.distanceTo(homeBaseGroup.position) < 3.5) {
                score += carriedBabies.length;
                document.getElementById('score').innerText = score;
                
                carriedBabies.forEach(baby => scene.remove(baby));
                carriedBabies = [];

                if (score >= 2) {
                    endGame(true);
                }
            }

            // Camera follow matching Level 2 angled style
            camera.position.x = snailGroup.position.x;
            camera.position.y = snailGroup.position.y + 7;
            camera.position.z = snailGroup.position.z + 8;
            camera.lookAt(snailGroup.position.x, snailGroup.position.y + 0.5, snailGroup.position.z);

            drawRadar();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
