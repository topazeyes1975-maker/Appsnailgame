<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>The Chaos Before the Savior: Level 2</title>
    <style>
        * { box-sizing: border-box; touch-action: none; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; padding: 0; overflow: hidden; background: #050508; font-family: sans-serif; width: 100vw; height: 100vh; }
        
        #ui { position: absolute; top: 10px; left: 10px; color: #00ffcc; font-size: 14px; font-weight: bold; pointer-events: none; z-index: 10; line-height: 1.4; text-shadow: 0 0 5px rgba(0,255,204,0.4); }
        
        .health-bar-container { width: 140px; height: 12px; background: rgba(255,255,255,0.1); border: 2px solid #00ffcc; border-radius: 4px; overflow: hidden; display: inline-block; vertical-align: middle; margin-left: 5px; }
        #health-fill { width: 100%; height: 100%; background: #00ffcc; transition: width 0.2s ease; box-shadow: 0 0 8px #00ffcc; }

        .joystick { position: absolute; bottom: 30px; width: 120px; height: 120px; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; pointer-events: auto; }
        #left-stick { left: 30px; }
        #right-stick { right: 30px; }
        .stick-knob { position: absolute; top: 35px; left: 35px; width: 50px; height: 50px; background: rgba(255,255,255,0.4); border-radius: 50%; pointer-events: none; }
    

        #status-screen { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh; 
            background: rgba(5,5,8,0.92); 
            display: none; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            color: #00ffcc; 
            font-size: 26px; 
            font-weight: bold; 
            z-index: 1000; 
            text-align: center; 
            text-shadow: 0 0 10px #00ffcc; 
            pointer-events: auto;
        }
        
        #star-display {
            font-size: 36px;
            margin: 15px 0;
            color: #ffcc00;
            text-shadow: 0 0 10px #ffcc00;
        }

        #status-screen button { 
            margin-top: 25px; 
            padding: 16px 32px; 
            background: #00ffcc; 
            border: none; 
            color: #050508; 
            font-size: 20px; 
            font-weight: bold; 
            border-radius: 10px; 
            cursor: pointer; 
            box-shadow: 0 0 15px #00ffcc;
            pointer-events: auto;
            touch-action: manipulation;
        }
    </style>
</head>
<body>
    <div id="ui">
        Objective: Level 2 - Avoid Guards, Rescue Babies & Escape!<br>
        Babies: <span id="score">0</span>/2 | Status: <span id="player-status">Active</span><br>
        Health: <div class="health-bar-container"><div id="health-fill"></div></div><br>
        Time Left: <span id="timer">60</span>
    </div>
    
    <div id="left-stick" class="joystick"><div id="left-knob" class="stick-knob"></div></div>
    <div id="right-stick" class="joystick"><div id="right-knob" class="stick-knob"></div></div>

    <div id="status-screen">
        <div id="status-text">LEVEL 2 COMPLETE</div>
        <div id="star-display"></div>
        <button id="restart-btn">Play Again</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <script>
        document.getElementById('restart-btn').addEventListener('click', function(e) {
            e.preventDefault();
            location.reload();
        });
        document.getElementById('restart-btn').addEventListener('touchend', function(e) {
            e.preventDefault();
            location.reload();
        });

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050508);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2.2, -2.8);
        camera.lookAt(0, 1.2, 4.0);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        const clock = new THREE.Clock();

        const loader = new THREE.GLTFLoader();
        const textureLoader = new THREE.TextureLoader();
        textureLoader.setCrossOrigin('anonymous');

        const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0x00ffcc, 1.5);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        const floorTexture = textureLoader.load('1785671824766.png', function(tex) {
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(8, 8);
            tex.needsUpdate = true;
        });

        const floorGeo = new THREE.PlaneGeometry(100, 100);
        const floorMat = new THREE.MeshStandardMaterial({ 
            map: floorTexture,
            color: 0xffffff,
            roughness: 0.8, 
            metalness: 0.2 
        });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -0.05;
        scene.add(floor);

        const floorGrid = new THREE.GridHelper(60, 30, 0x00ffcc, 0x1a1a3a);
        floorGrid.position.y = 0.01;
        scene.add(floorGrid);

        const homeBaseGroup = new THREE.Group();
        homeBaseGroup.position.set(-18, 0.02, 18);
        scene.add(homeBaseGroup);

        const baseGeo = new THREE.BoxGeometry(4, 0.1, 4);
        const baseMat = new THREE.MeshStandardMaterial({ color: 0x00ffcc, emissive: 0x00ffcc, emissiveIntensity: 0.3 });
        const fallbackBase = new THREE.Mesh(baseGeo, baseMat);
        homeBaseGroup.add(fallbackBase);

        const wallTexture = textureLoader.load('1785672040480.png', function(tex) {
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(2, 1);
            tex.needsUpdate = true;
        });

        const obstacleMat = new THREE.MeshStandardMaterial({ 
            map: wallTexture,
            color: 0xffffff,
            roughness: 0.4, 
            metalness: 0.5 
        });

        const wallBoundingBoxes = [];
        const wallMeshes = [];

        function createWall(x, z, width, depth) {
            const wallGeo = new THREE.BoxGeometry(width, 5.0, depth);
            const wall = new THREE.Mesh(wallGeo, obstacleMat);
            wall.position.set(x, 2.5, z);
            scene.add(wall);
            wallMeshes.push(wall);

            const edges = new THREE.EdgesGeometry(wallGeo);
            const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x00ffcc }));
            line.position.copy(wall.position);
            scene.add(line);

            const box = new THREE.Box3().setFromObject(wall);
            wallBoundingBoxes.push(box);
        }

        createWall(-1, -22, 44, 2);   
        createWall(-22, -2, 2, 40);   
        createWall(21, 2, 2, 40);     
        createWall(-30, -10, 2, 20);  
        createWall(0, 22, 44, 2);      

        createWall(-15, -13, 16, 1);   
        createWall(-1, -7, 30, 0.8);   
        createWall(-2, -14, 0.8, 14);  
        createWall(-19, 0, 7, 0.8);    
        createWall(18, 11, 0.8, 10);   
        createWall(16, -17.5, 8, 0.8); 
        createWall(5, -17, 0.8, 8);    
        createWall(4, -2, 12, 0.8);    
        createWall(-8, 10, 0.8, 16);   
        createWall(9, 18, 4, 0.8);     
        createWall(-16, 6, 0.8, 12);   
        createWall(-12, 12, 8, 0.8);   
        createWall(-12, 17.5, 8, 0.8); 
        createWall(12, 6, 12, 0.8);    
        createWall(7.5, 13, 0.8, 12);  
        createWall(11, 14, 8, 0.8);    

        const roomGeo = new THREE.BoxGeometry(2.5, 2.5, 2.5);
        const roomMat = new THREE.MeshStandardMaterial({ color: 0xff0055, emissive: 0xff0055, emissiveIntensity: 0.5, wireframe: true });

        const room1 = new THREE.Mesh(roomGeo, roomMat);
        room1.position.set(-16, 1.25, -16);
        scene.add(room1);

        const room2 = new THREE.Mesh(roomGeo, roomMat);
        room2.position.set(12, 1.25, 10);
        scene.add(room2);

        const rooms = [];

        const fallbackBabyGeo = new THREE.SphereGeometry(0.6, 16, 16);
        const fallbackBabyMat = new THREE.MeshStandardMaterial({ color: 0xff0055, emissive: 0xff0055, emissiveIntensity: 0.8 });

        function createFallbackBaby(x, z) {
            const mesh = new THREE.Mesh(fallbackBabyGeo, fallbackBabyMat);
            mesh.position.set(x, 0.6, z);
            scene.add(mesh);
            return mesh;
        }

        let babyModelTemplate = null;

        loader.load('Meshy_AI_Galactic Snail_1785475444_image-to-3d-texture-compressed.glb', function (gltf) {
            babyModelTemplate = gltf.scene;
            initRoomsWithModels();
        }, undefined, function (error) {
            rooms.push({ mesh: room1, babyMesh: createFallbackBaby(-16, -16), rescued: false });
            rooms.push({ mesh: room2, babyMesh: createFallbackBaby(12, 10), rescued: false });
        });

        function initRoomsWithModels() {
            if (!babyModelTemplate) return;
            
            const babyModel1 = babyModelTemplate.clone();
            babyModel1.scale.set(0.5, 0.5, 0.5);
            babyModel1.position.set(-16, 0.3, -16);
            scene.add(babyModel1);

            const babyModel2 = babyModelTemplate.clone();
            babyModel2.scale.set(0.5, 0.5, 0.5);
            babyModel2.position.set(12, 0.3, 10);
            scene.add(babyModel2);

            rooms.push({ mesh: room1, babyMesh: babyModel1, rescued: false });
            rooms.push({ mesh: room2, babyMesh: babyModel2, rescued: false });
        }

        const bellGroup = new THREE.Group();
        bellGroup.position.set(0, 0.75, -8);
        scene.add(bellGroup);

        const fallbackBellGeo = new THREE.ConeGeometry(0.8, 1.5, 16);
        const fallbackBellMat = new THREE.MeshStandardMaterial({ color: 0xffcc00, emissive: 0xffcc00, emissiveIntensity: 0.6, metalness: 0.8 });
        const fallbackBell = new THREE.Mesh(fallbackBellGeo, fallbackBellMat);
        bellGroup.add(fallbackBell);

        loader.load(encodeURI('Meshy_AI_Neon Liberty Bell_1785740945_image-to-3d-texture-compressed.glb'), function (gltf) {
            bellGroup.remove(fallbackBell);
            const bellModel = gltf.scene;
            bellModel.scale.set(0.8, 0.8, 0.8);
            bellGroup.add(bellModel);
        }, undefined, function (error) {});

        let bellVelocity = new THREE.Vector3(0.06, 0, 0.05);

        const enemies = [];
        const bullets = [];
        const bulletGeo = new THREE.SphereGeometry(0.25, 8, 8);
        const bulletMat = new THREE.MeshStandardMaterial({ color: 0xff3300, emissive: 0xff3300, emissiveIntensity: 1.0 });
        const enemyMat = new THREE.MeshStandardMaterial({ color: 0xff3300, emissive: 0xff3300, emissiveIntensity: 0.4 });

        const patrolRoutes = [
            [new THREE.Vector3(-15, 0, -10), new THREE.Vector3(15, 0, -10), new THREE.Vector3(15, 0, -3), new THREE.Vector3(-15, 0, -3)],
            [new THREE.Vector3(10, 0, -3), new THREE.Vector3(18, 0, -3), new THREE.Vector3(18, 0, 15), new THREE.Vector3(10, 0, 15)],
            [new THREE.Vector3(-10, 0, 5), new THREE.Vector3(5, 0, 5), new THREE.Vector3(5, 0, 12), new THREE.Vector3(-10, 0, 12)]
        ];

        for (let i = 0; i < patrolRoutes.length; i++) {
            const enemyGroup = new THREE.Group();
            const route = patrolRoutes[i];
            enemyGroup.position.copy(route[0]);
            scene.add(enemyGroup);

            const fallbackEnemy = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.8, 1.2), enemyMat);
            enemyGroup.add(fallbackEnemy);

            loader.load(encodeURI('Meshy_AI_Nebula Vanguard_1785730919_image-to-3d-texture-compressed.glb'), function (gltf) {
                enemyGroup.remove(fallbackEnemy);
                const humanModel = gltf.scene;
                humanModel.position.y = 0.9;
                humanModel.scale.set(0.8, 0.8, 0.8);
                enemyGroup.add(humanModel);
            }, undefined, function (error) {});

            enemies.push({ 
                mesh: enemyGroup, 
                route: route,
                targetIndex: 1,
                speed: 3.3,
                shootCooldown: 0
            });
        }

        const snailGroup = new THREE.Group();
        scene.add(snailGroup);
        snailGroup.add(camera);
        snailGroup.position.set(-18, 0, 12);

        const shieldGeo = new THREE.SphereGeometry(1.6, 32, 32);
        const shieldMat = new THREE.MeshPhysicalMaterial({ 
            color: 0x00ffff, 
            transparent: true, 
            opacity: 0.45, 
            roughness: 0.1, 
            metalness: 0.9,
            clearcoat: 1.0, 
            clearcoatRoughness: 0.1,
            emissive: 0x00aaff,
            emissiveIntensity: 0.5
        });
        const reflectiveShield = new THREE.Mesh(shieldGeo, shieldMat);
        reflectiveShield.position.y = 0.8;
        snailGroup.add(reflectiveShield);

        const fallbackMainGeo = new THREE.BoxGeometry(1, 1, 1);
        const fallbackMainMat = new THREE.MeshStandardMaterial({ color: 0x00ffcc, emissive: 0x00ffcc });
        const fallbackMain = new THREE.Mesh(fallbackMainGeo, fallbackMainMat);
        fallbackMain.position.y = 0.5;
        snailGroup.add(fallbackMain);

        loader.load('Meshy_AI_Astral Knight of the Cosmic Shell_1781887443_image-to-3d-texture-compressed.glb', function (gltf) {
            snailGroup.remove(fallbackMain);
            const character = gltf.scene;
            character.scale.set(0.8, 0.8, 0.8);
            character.position.y = 0.9; 
            snailGroup.add(character);
        }, undefined, function (error) {});

        let moveX = 0, moveZ = 0;
        let isShieldActive = false;
        let isBoostActive = false; 
        let shieldUsedEver = false; 
        let tookDamage = false;      
        let score = 0;
        let health = 100;
        let carriedBabies = [];
        let timeLeft = 60;
        let freezeTimer = 0;
        let gameOver = false;

        const raycaster = new THREE.Raycaster();

        setInterval(() => {
            if (!gameOver && timeLeft > 0) {
                timeLeft--;
                document.getElementById('timer').innerText = timeLeft;
                if (timeLeft === 0 && score < 2) {
                    endGame("TIME UP - MISSION FAILED");
                }
            }
        }, 1000);

        function setupJoystick(stickId, knobId, callback) {
            const stick = document.getElementById(stickId);
            const knob = document.getElementById(knobId);
            const maxDist = 28;
            let activeTouchId = null;

            stick.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const touch = e.changedTouches[0];
                activeTouchId = touch.identifier;
                updateStick(touch);
            }, { passive: false });

            window.addEventListener('touchmove', (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === activeTouchId) {
                        e.preventDefault();
                        updateStick(e.changedTouches[i]);
                    }
                }
            }, { passive: false });

            window.addEventListener('touchend', (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === activeTouchId) {
                        activeTouchId = null;
                        knob.style.transform = `translate(0px, 0px)`;
                        callback(0, 0);
                    }
                }
            });

            function updateStick(touch) {
                const r = stick.getBoundingClientRect();
                let x = touch.clientX - r.left - (r.width / 2);
                let y = touch.clientY - r.top - (r.height / 2);
                const dist = Math.sqrt(x * x + y * y);
                if (dist > maxDist) { x = (x / dist) * maxDist; y = (y / dist) * maxDist; }
                knob.style.transform = `translate(${x}px, ${y}px)`;
                callback(x / maxDist, y / maxDist);
            }
        }

        setupJoystick('left-stick', 'left-knob', (x, y) => { moveX = x; moveZ = y; });

        setupJoystick('right-stick', 'right-knob', (x, y) => {
            if (Math.abs(x) > 0.3 || Math.abs(y) > 0.3) {
                isShieldActive = true;
                shieldUsedEver = true; 
                reflectiveShield.scale.set(1.3, 1.3, 1.3);

                if (y > 0.3) {
                    isBoostActive = true;
                    shieldMat.color.setHex(0xffaa00);
                    shieldMat.emissive.setHex(0xffaa00);
                    shieldMat.emissiveIntensity = 1.2;
                } else {
                    isBoostActive = false;
                    shieldMat.color.setHex(0x00ffff);
                    shieldMat.emissive.setHex(0x00aaff);
                    shieldMat.emissiveIntensity = 1.0;
                }
            } else {
                isShieldActive = false;
                isBoostActive = false;
                reflectiveShield.scale.set(1.0, 1.0, 1.0);
                shieldMat.color.setHex(0x00ffff);
                shieldMat.emissive.setHex(0x00aaff);
                shieldMat.emissiveIntensity = 0.4;
            }
        });

        function updateHealthBar() {
            const fill = document.getElementById('health-fill');
            fill.style.width = Math.max(0, health) + '%';
            fill.style.background = health < 30 ? '#ff3300' : '#00ffcc';
        }

        function endGame(message) {
            gameOver = true;
            document.getElementById('status-text').innerText = message;
            
            if (message.includes("VICTORY")) {
                let stars = 0;
                if (!shieldUsedEver) stars++; 
                if (timeLeft >= 20) stars++;   
                if (!tookDamage) stars++;      

                let starString = "";
                for (let i = 0; i < 3; i++) {
                    starString += i < stars ? "⭐ " : "☆ ";
                }
                document.getElementById('star-display').innerText = starString;
            } else {
                document.getElementById('star-display').innerText = "";
            }

            document.getElementById('status-screen').style.display = 'flex';
        }

        function canEntityMoveTo(nextX, nextZ, size) {
            const box = new THREE.Box3(
                new THREE.Vector3(nextX - size, 0, nextZ - size),
                new THREE.Vector3(nextX + size, 2, nextZ + size)
            );
            for (let wallBox of wallBoundingBoxes) {
                if (box.intersectsBox(wallBox)) return false;
            }
            return true;
        }

        function hasLineOfSight(guardPos, playerPos) {
            const dir = new THREE.Vector3().subVectors(playerPos, guardPos).normalize();
            const dist = guardPos.distanceTo(playerPos);
            
            raycaster.set(new THREE.Vector3(guardPos.x, 1.0, guardPos.z), dir);
            const intersects = raycaster.intersectObjects(wallMeshes);
            
            if (intersects.length > 0 && intersects[0].distance < dist) {
                return false;
            }
            return true;
        }

        function animate() {
            requestAnimationFrame(animate);
            if (gameOver) return;

            const delta = Math.min(clock.getDelta(), 0.1);

            if (freezeTimer > 0) {
                freezeTimer -= delta;
                document.getElementById('player-status').innerText = "FROZEN (" + Math.ceil(freezeTimer) + "s)";
                document.getElementById('player-status').style.color = "#ffcc00";
            } else {
                let statusElement = document.getElementById('player-status');
                if (isBoostActive) {
                    statusElement.innerText = "BOOST SHIELD!";
                    statusElement.style.color = "#ffaa00";
                } else if (isShieldActive) {
                    statusElement.innerText = "SHIELD ACTIVE";
                    statusElement.style.color = "#00ffff";
                } else {
                    statusElement.innerText = "Active";
                    statusElement.style.color = "#00ffcc";
                }

                let currentSpeed = isBoostActive ? 16.0 : 7.5;

                if (moveX !== 0) snailGroup.rotation.y -= moveX * 2.5 * delta;
                let nextX = snailGroup.position.x - Math.sin(snailGroup.rotation.y) * moveZ * currentSpeed * delta;
                let nextZ = snailGroup.position.z - Math.cos(snailGroup.rotation.y) * moveZ * currentSpeed * delta;

                if (canEntityMoveTo(nextX, snailGroup.position.z, 0.65)) snailGroup.position.x = nextX;
                if (canEntityMoveTo(snailGroup.position.x, nextZ, 0.65)) snailGroup.position.z = nextZ;
            }

            reflectiveShield.rotation.y += (isBoostActive ? 4.8 : 1.2) * delta;

            let nextBellX = bellGroup.position.x + bellVelocity.x;
            let nextBellZ = bellGroup.position.z + bellVelocity.z;

            if (!canEntityMoveTo(nextBellX, bellGroup.position.z, 0.9)) {
                bellVelocity.x *= -1;
            } else {
                bellGroup.position.x = nextBellX;
            }

            if (!canEntityMoveTo(bellGroup.position.x, nextBellZ, 0.9)) {
                bellVelocity.z *= -1;
            } else {
                bellGroup.position.z = nextBellZ;
            }
            bellGroup.rotation.y += 1.8 * delta;

            if (freezeTimer <= 0 && snailGroup.position.distanceTo(bellGroup.position) < 1.8) {
                freezeTimer = 5.0; 
            }

            enemies.forEach(en => {
                let distToSnail = en.mesh.position.distanceTo(snailGroup.position);
                let canSeePlayer = distToSnail < 18 && hasLineOfSight(en.mesh.position, snailGroup.position);

                let targetPos = canSeePlayer ? snailGroup.position : en.route[en.targetIndex];
                let dir = new THREE.Vector3().subVectors(targetPos, en.mesh.position);
                dir.y = 0;
                let distToTarget = dir.length();

                if (!canSeePlayer && distToTarget < 0.4) {
                    en.targetIndex = (en.targetIndex + 1) % en.route.length;
                } else if (distToTarget > 0.1) {
                    dir.normalize();

                    let stepX = en.mesh.position.x + dir.x * en.speed * delta;
                    let stepZ = en.mesh.position.z + dir.z * en.speed * delta;

                    let moved = false;

                    if (canEntityMoveTo(stepX, stepZ, 0.6)) {
                        en.mesh.position.x = stepX;
                        en.mesh.position.z = stepZ;
                        moved = true;
                    } else if (canEntityMoveTo(stepX, en.mesh.position.z, 0.6)) {
                        en.mesh.position.x = stepX; 
                        moved = true;
                    } else if (canEntityMoveTo(en.mesh.position.x, stepZ, 0.6)) {
                        en.mesh.position.z = stepZ; 
                        moved = true;
                    }

                    if (moved) {
                        en.mesh.rotation.y = Math.atan2(dir.x, dir.z);
                    } else if (!canSeePlayer) {
                        en.targetIndex = (en.targetIndex + 1) % en.route.length;
                    }
                }

                if (canSeePlayer) {
                    en.shootCooldown--;
                    if (en.shootCooldown <= 0) {
                        en.shootCooldown = 75;
                        
                        const shootDir = new THREE.Vector3().subVectors(snailGroup.position, en.mesh.position).normalize();
                        const bullet = new THREE.Mesh(bulletGeo, bulletMat);
                        
                        bullet.position.copy(en.mesh.position).addScaledVector(shootDir, 1.2);
                        bullet.position.y = 1.0;
                        
                        scene.add(bullet);
                        bullets.push({ mesh: bullet, dir: shootDir, speed: 12.0, bounces: 0 });
                    }
                }
            });

            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.mesh.position.addScaledVector(b.dir, b.speed * delta);

                let bulletBox = new THREE.Box3().setFromObject(b.mesh);
                let bulletRemoved = false;

                for (let wallBox of wallBoundingBoxes) {
                    if (bulletBox.intersectsBox(wallBox)) {
                        b.dir.negate();
                        b.bounces = (b.bounces || 0) + 1;

                        if (b.bounces >= 2) {
                            scene.remove(b.mesh);
                            bullets.splice(i, 1);
                            bulletRemoved = true;
                        }
                        break;
                    }
                }

                if (bulletRemoved) continue;

                let distToPlayer = b.mesh.position.distanceTo(snailGroup.position);

                if (isShieldActive && distToPlayer < 2.0) {
                    b.dir.negate();
                    b.speed *= 1.2;
                    b.mesh.material.color.setHex(0x00ffff);
                } 
                else if (!isShieldActive && distToPlayer < 1.2) {
                    health = Math.max(0, health - 15);
                    tookDamage = true;
                    updateHealthBar();
                    
                    scene.remove(b.mesh);
                    bullets.splice(i, 1);
                    if (health <= 0) endGame("GAME OVER - SHOT DOWN");
                    continue;
                }

                if (Math.abs(b.mesh.position.x) > 35 || Math.abs(b.mesh.position.z) > 35) {
                    scene.remove(b.mesh);
                    bullets.splice(i, 1);
                }
            }

            rooms.forEach(room => {
                if (!isShieldActive && !room.rescued && room.babyMesh && snailGroup.position.distanceTo(room.mesh.position) < 3.0) {
                    room.rescued = true;
                    room.mesh.visible = false;
                    carriedBabies.push(room.babyMesh);
                }
            });

            for (let i = 0; i < carriedBabies.length; i++) {
                let baby = carriedBabies[i];
                let targetPos = snailGroup.position.clone().add(new THREE.Vector3(0, 0, 1.5 + (i * 1.0)).applyAxisAngle(new THREE.Vector3(0,1,0), snailGroup.rotation.y));
                baby.position.lerp(targetPos, 0.1);
                baby.position.y = 0.3;
            }

            if (carriedBabies.length > 0 && snailGroup.position.distanceTo(homeBaseGroup.position) < 3.5) {
                score += carriedBabies.length;
                document.getElementById('score').innerText = score;
                
                carriedBabies.forEach(baby => scene.remove(baby));
                carriedBabies = [];

                if (score >= 2) {
                    endGame("LEVEL 2 VICTORY!");
                }
            }

            camera.lookAt(
                snailGroup.position.x + Math.sin(snailGroup.rotation.y) * 4,
                snailGroup.position.y + 1.2,
                snailGroup.position.z + Math.cos(snailGroup.rotation.y) * 4
            );

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
